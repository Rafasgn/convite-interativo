# fly.toml app configuration file generated for convite-interativo on 2026-08-29T12:58:24-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'convite-interativo'
primary_region = 'gru'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[mounts]
  source = 'convite_data'
  destination = '/data'

[env]
  ConnectionStrings__Default = 'Data Source=/data/convite.db'
